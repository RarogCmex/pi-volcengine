---
# Зачем это нужно. `peerDependencies` здесь намеренно `*` — так велят доки pi
# (`docs/packages.md`), поэтому новый pi молча загрузит расширение и дрейф хоста
# возможен без единого коммита здесь. Это не гипотеза: 2026-09-30 pi 0.87.1 →
# 0.99.1 изменил то, как тело ошибки доезжает до адаптера, и три теста
# pi-fuelix покраснели; нашлось случайно, еженедельное расписание ниже ловит
# такое само.
#
# Отличие этой репы от остальных в семействе: хост здесь — настоящая
# `devDependencies` (pi 0.87.0, TypeScript 5.9.3, `package-lock.json`
# закоммичен), симлинков на глобальную установку нет. Поэтому две job'ы:
#   pinned — `npm ci`, то есть ровно поддерживаемая конфигурация;
#   latest — то же, но два pi-пакета заменены на свежие: это и есть детектор дрейфа.
# На 2026-09-30 обе зелёные (pinned — в рабочем дереве, latest — в клоне с
# подменой пакетов: typecheck + все тесты).
#
# Прогоняется только офлайн-набор; `live/` требует ключ и тратит реальные кредиты.
name: check

"on":
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Понедельник 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: pinned host (npm ci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 — нижняя граница `engines`, 26 — то, на чём расширение разрабатывалось;
        # обе прогнаны локально 2026-09-30.
        node: ["22", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned dependencies
        run: npm ci

      - name: Show what is being tested
        run: |
          node --version
          npm ls --depth=0 @earendil-works/pi-coding-agent @earendil-works/pi-ai typescript

      - name: Typecheck and test
        run: npm run check

  latest:
    name: latest host (drift catcher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned dependencies
        run: npm ci

      - name: Point the repo at the latest published host (one matched copy)
        # Почему не `npm install …@latest` поверх дерева. Первый вариант этого шага
        # делал именно так и давал красный typecheck при полностью зелёных тестах:
        # npm оставлял в дереве **две** копии pi-ai (нашу поверх + вложенную
        # зависимость pi), и TypeScript сравнивал два номинально разных набора
        # типов — `Provider<GatewayApi>` не присваивался `Provider<Api>`
        # (TS2345, прогон 2026-09-30; те же деревья с одной парой — 157/157 и
        # typecheck rc=0). Поэтому хост ставится в отдельный префикс и линкуется
        # одной согласованной парой — тот же приём, что `scripts/link-pi.mjs`
        # в остальных девяти репах семейства.
        #
        # Если шаг красный — сначала смотрим на guard и версии ниже, и только
        # потом подозреваем код: тесты идут следующим шагом.
        run: |
          set -euo pipefail
          HOST=/tmp/pi-host
          rm -rf "$HOST"; mkdir -p "$HOST"; cd "$HOST"
          npm init --yes >/dev/null
          npm install @earendil-works/pi-coding-agent@latest >/dev/null
          cd "$GITHUB_WORKSPACE"

          PI="$HOST/node_modules/@earendil-works/pi-coding-agent"
          PIAI="$PI/node_modules/@earendil-works/pi-ai"
          [ -d "$PIAI" ] || PIAI="$HOST/node_modules/@earendil-works/pi-ai"
          [ -d "$PIAI" ] || { echo "::error::pi-ai not found next to the freshly installed pi"; exit 1; }

          rm -rf node_modules/@earendil-works/pi-ai node_modules/@earendil-works/pi-coding-agent
          ln -s "$PI" node_modules/@earendil-works/pi-coding-agent
          ln -s "$PIAI" node_modules/@earendil-works/pi-ai

          # guard: pi-ai в дереве обязана быть ТОЙ ЖЕ копией, что несёт сам pi.
          # Иначе typecheck сравнивает два набора типов и врёт про несовместимость.
          TOP_REAL=$(node -e 'console.log(require("fs").realpathSync("node_modules/@earendil-works/pi-ai"))')
          HOST_REAL=$(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$PIAI")
          if [ "$TOP_REAL" != "$HOST_REAL" ]; then
            echo "::error::pi-ai in the tree ($TOP_REAL) is not the copy pi bundles ($HOST_REAL)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const ver = (p) => JSON.parse(fs.readFileSync(p + "/package.json", "utf8")).version;
            console.log("host under test: pi-coding-agent " + ver("node_modules/@earendil-works/pi-coding-agent")
              + " + pi-ai " + ver("node_modules/@earendil-works/pi-ai") + " (one copy)");
          '

      - name: Typecheck and test against the latest host
        run: npm run check
